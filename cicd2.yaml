name: cicd

on:
  push:
    branches:
      -deploy-to-ec2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t intergrationninjas-react-app
      - name: Publish image to docker Hub
        run: docker push intergrationninjas-react-app:latest

  deploy: 
    needs: build
    runs-on: aws-ec2
    steps:
      - name: Pull image from docker Hub
        run: docker pull intergrationninjas-react-app:latest
      - name: Delete Old Container
        run: docker rm -f reactContainer
      - name: Run docker Container
        run: docker run -d -p 8000:80 --name reactContainer intergrationninjas-react-app